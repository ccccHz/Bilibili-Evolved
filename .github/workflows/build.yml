name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - master-cdn
      - preview
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: "0"
      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: Type check
        run: pnpm run type
      - name: ESLint check
        run: pnpm run lint-check
      - name: Build core
        run: pnpm run build-core
      - name: Build features
        run: |
          cd registry
          pnpm install
          cd ../
          pnpm --dir registry/lib/components/live/danmaku-visibility-check install --frozen-lockfile
          pnpm run build-features
